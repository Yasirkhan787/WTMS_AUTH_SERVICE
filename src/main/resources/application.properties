# =========================================================
# Application
# =========================================================
spring.application.name=auth-service
server.port=${SERVER_PORT:8762}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# =========================================================
# Eureka Client
# =========================================================
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# =========================================================
# Datasource (PostgreSQL)
# CHANGED: credentials/URL/paths were hardcoded (including a Windows dev machine path for
# the JWT private key) - all now come from environment variables so the same properties
# file works across dev/staging/prod without editing.
# =========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wtms_auth_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.pool-name=AuthServiceHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# CHANGED: "update" auto-alters the schema at boot based on entities - fine for a solo dev
# box, unsafe for prod (silent, unreviewed DDL). Use Flyway/Liquibase migrations and keep
# Hibernate on "validate" so it only checks the schema matches, never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================================================
# JWT keys
# CHANGED: private key path was an absolute local dev path (D:/Uni Data/...); the secret
# was plaintext in the file. Both now come from the environment/secret manager.
# =========================================================
jwt.private-key.path=file:${JWT_PRIVATE_KEY_PATH}
jwt.public-key.path=${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
app.security.internal-secret=${GATEWAY_INTERNAL_SECRET}

# =========================================================
# Kafka
# =========================================================
kafka.bootstrap.server=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.consumer.group=${KAFKA_CONSUMER_GROUP:auth-group}

# =========================================================
# Redis
# =========================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:2}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# =========================================================
# Mail (SMTP)
# =========================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =========================================================
# Distributed tracing
# NOTE: management.tracing.enabled + sampling were already set, but no exporter endpoint
# was configured, so spans had nowhere to go. Pick ONE of the exporters below depending on
# your tracing backend (Zipkin or an OTLP collector such as Jaeger/Tempo/Grafana Cloud) and
# uncomment/set it - otherwise traces are generated but never shipped anywhere.
# =========================================================
management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# =========================================================
# Logging
# CHANGED: added traceId/spanId to the console pattern so every controller log line
# added in AuthController/UserController can be correlated back to a single request/trace
# in your log aggregator (e.g. searching by traceId across this and downstream services).
# =========================================================
logging.level.root=WARN
logging.level.com.yasirkhan.auth=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %-5level %logger{36} - %msg%n

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# =========================================================
# Misc
# =========================================================
spring.jackson.default-property-inclusion=non_null
spring.web.resources.add-mappings=false